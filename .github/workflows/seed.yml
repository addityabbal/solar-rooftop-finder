name: seed

# Manual: build a list of starter pincodes, one after another.
on:
  workflow_dispatch:
    inputs:
      pins:
        description: "Space-separated pincodes"
        required: true
        default: "400703 400709 380015 600132"

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Build each pincode
        env:
          PINS: ${{ inputs.pins }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          KV_NAMESPACE_ID: ${{ vars.KV_NAMESPACE_ID }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
        run: |
          for pin in $PINS; do
            [[ "$pin" =~ ^[1-9][0-9]{5}$ ]] || { echo "skip $pin"; continue; }
            python pipeline/build_pincode.py "$pin" --publish || echo "::warning::$pin failed"
          done
