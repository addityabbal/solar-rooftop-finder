[project]
name = "solar-rooftop-worker"
version = "0.1.0"
description = "Pipeline worker for the Solar Rooftop Lead Finder"
requires-python = ">=3.12"
dependencies = ["duckdb>=1.1", "httpx>=0.27"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["worker/tests"]
pythonpath = ["."]
